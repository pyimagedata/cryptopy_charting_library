<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Charting Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: #1a1a2e;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            overscroll-behavior: none;
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #chart {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .replay-panel {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(980px, calc(100vw - 28px));
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(22, 28, 43, 0.96), rgba(14, 19, 31, 0.94));
            backdrop-filter: blur(14px);
            color: #e5e7eb;
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .replay-panel.hidden {
            display: none;
        }

        .replay-panel__row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .replay-panel__row--main {
            flex-wrap: wrap;
        }

        .replay-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            flex: 0 0 auto;
        }

        .replay-ghost,
        .replay-chip,
        .replay-icon-btn,
        .replay-close,
        .replay-speed {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #f8fafc;
            border-radius: 10px;
        }

        .replay-chip,
        .replay-ghost,
        .replay-speed {
            height: 36px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .replay-icon-btn,
        .replay-close {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .replay-chip,
        .replay-ghost,
        .replay-icon-btn,
        .replay-close {
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s;
        }

        .replay-chip:hover,
        .replay-ghost:hover,
        .replay-icon-btn:hover,
        .replay-close:hover,
        .replay-speed:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .replay-chip.active {
            background: rgba(41, 98, 255, 0.18);
            color: #93c5fd;
            border-color: rgba(41, 98, 255, 0.42);
        }

        .replay-chip svg,
        .replay-icon-btn svg,
        .replay-close svg {
            flex: 0 0 auto;
        }

        .replay-speed {
            appearance: none;
            outline: none;
            min-width: 70px;
            cursor: pointer;
        }

        .replay-speed option {
            color: #111827;
        }

        .replay-pill {
            min-width: 56px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 0 12px;
            background: rgba(99, 102, 241, 0.14);
            color: #c7d2fe;
            font-size: 13px;
            border: 1px solid rgba(99, 102, 241, 0.24);
        }

        .replay-status {
            min-width: 210px;
            color: #93c5fd;
            font-size: 12px;
            letter-spacing: 0.01em;
        }

        .replay-grow {
            flex: 1 1 auto;
        }

        .replay-slider-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .replay-slider-label {
            color: #94a3b8;
            font-size: 12px;
            white-space: nowrap;
        }

        .replay-panel input[type="range"] {
            width: 100%;
            accent-color: #2962ff;
        }

        .replay-panel button:disabled,
        .replay-panel select:disabled,
        .replay-panel input:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .replay-picker-line {
            position: absolute;
            top: 38px;
            bottom: 28px;
            width: 2px;
            background: #2962ff;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
            z-index: 35;
            pointer-events: none;
            display: none;
        }

        .replay-picker-line::after {
            content: "✂";
            position: absolute;
            left: 50%;
            bottom: -24px;
            transform: translateX(-50%);
            color: #111827;
            background: #ffffff;
            border-radius: 999px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
        }

        .toolbar-layout-wrap {
            position: relative;
            display: flex;
            align-items: center;
            margin-left: 8px;
        }

        .toolbar-settings-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            margin-left: 8px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #d1d4dc;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .toolbar-settings-button:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .toolbar-settings-button svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        .toolbar-layout-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 38px;
            height: 30px;
            padding: 0 8px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #d1d4dc;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }

        .toolbar-layout-trigger:hover,
        .toolbar-layout-trigger.open {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .toolbar-layout-trigger__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .toolbar-layout-trigger svg {
            display: block;
        }

        .toolbar-layout-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            z-index: 80;
            display: none;
            width: max-content;
            padding: 6px;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow:
                0 10px 22px rgba(15, 23, 42, 0.1),
                0 2px 8px rgba(15, 23, 42, 0.06);
        }

        .toolbar-layout-menu.open {
            display: block;
        }

        .toolbar-layout-grid {
            display: grid;
            grid-template-columns: repeat(4, max-content);
            gap: 3px;
            justify-content: start;
        }

        .toolbar-layout-option {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: #1f2937;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .toolbar-layout-option:hover {
            background: rgba(15, 23, 42, 0.03);
        }

        .toolbar-layout-option.active {
            background: rgba(15, 23, 42, 0.04);
            color: #111827;
            border-color: rgba(15, 23, 42, 0.1);
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.03);
        }

        .toolbar-layout-option svg {
            width: 18px;
            height: 18px;
            display: block;
        }
</style>
</head>
<body>
    <div id="chart"></div>
    <div id="replay-picker-line" class="replay-picker-line"></div>
    <div id="replay-panel" class="replay-panel hidden">
        <div class="replay-panel__row replay-panel__row--main">
            <button id="replay-select" class="replay-chip" type="button">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 4v12"/>
                    <path d="M15 7l-4 3 4 3"/>
                    <path d="M18 4v12"/>
                </svg>
                <span>Select bar</span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 4.5 6 7.5 9 4.5"/>
                </svg>
            </button>
            <div class="replay-divider"></div>
            <button id="replay-step-back" class="replay-icon-btn" type="button" disabled title="Geri">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.5 5 7 10l5.5 5"/>
                </svg>
            </button>
            <button id="replay-play" class="replay-icon-btn" type="button" disabled title="Oynat">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
                    <path d="m7 5 8 5-8 5z"/>
                </svg>
            </button>
            <button id="replay-step-forward" class="replay-icon-btn" type="button" disabled title="Ileri">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7.5 5 5.5 5-5.5 5"/>
                </svg>
            </button>
            <select id="replay-speed" class="replay-speed" disabled>
            <option value="1200">0.5x</option>
            <option value="700">1x</option>
            <option value="350">2x</option>
            <option value="150">4x</option>
            </select>
            <div id="replay-interval" class="replay-pill">1H</div>
            <div class="replay-divider"></div>
            <div id="replay-status" class="replay-status">Canli</div>
            <div class="replay-grow"></div>
            <button id="replay-stop" class="replay-close" type="button" disabled title="Kapat">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M5 5 15 15"/>
                    <path d="M15 5 5 15"/>
                </svg>
            </button>
        </div>
        <div class="replay-slider-wrap">
            <div class="replay-slider-label">Bar</div>
            <input id="replay-slider" type="range" min="0" max="0" value="0" step="1" disabled>
        </div>
    </div>

    <script src="packages/charts/dist/charts.js?v=2"></script>
    <script>
        const DEMO_LAYOUT_STORAGE_KEY = 'charting-demo-layout-state-v1';
        const ALLOWED_LAYOUT_MODES = new Set(['single', '2x1', '1x2', '1x3', '2x2']);
        const ALLOWED_CHART_TYPES = new Set(['candles', 'line', 'area', 'heiken-ashi']);
        const ALLOWED_PRICE_SCALES = new Set(['normal', 'logarithmic']);

        function normalizeLayoutMode(mode) {
            return ALLOWED_LAYOUT_MODES.has(mode) ? mode : 'single';
        }

        function normalizeChartType(type) {
            return ALLOWED_CHART_TYPES.has(type) ? type : 'candles';
        }

        function normalizePriceScaleMode(mode) {
            return ALLOWED_PRICE_SCALES.has(mode) ? mode : 'normal';
        }

        function normalizeSlotState(slot, fallback = {}) {
            return {
                symbol: typeof slot?.symbol === 'string' && slot.symbol ? slot.symbol : (fallback.symbol || 'BTCUSDT'),
                interval: typeof slot?.interval === 'string' && slot.interval ? slot.interval : (fallback.interval || fallback.timeframe || '1h'),
                timeframe: typeof slot?.timeframe === 'string' && slot.timeframe ? slot.timeframe : (slot?.interval || fallback.timeframe || fallback.interval || '1h'),
                exchange: typeof slot?.exchange === 'string' && slot.exchange ? slot.exchange : (fallback.exchange || 'BINANCE'),
                chartType: normalizeChartType(slot?.chartType),
                priceScaleMode: normalizePriceScaleMode(slot?.priceScaleMode),
            };
        }

        function loadPersistedDemoState() {
            try {
                const raw = localStorage.getItem(DEMO_LAYOUT_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return null;
                return parsed;
            } catch (error) {
                console.warn('Kayitli layout durumu okunamadi:', error);
                return null;
            }
        }

        const persistedDemoState = loadPersistedDemoState();
        const persistedSingleState = persistedDemoState?.single || {};
        const persistedMultiState = persistedDemoState?.multi || {};

        // Default parameters
        let currentSymbol = typeof persistedSingleState.symbol === 'string' && persistedSingleState.symbol
            ? persistedSingleState.symbol
            : 'BTCUSDT';
        let currentInterval = typeof persistedSingleState.interval === 'string' && persistedSingleState.interval
            ? persistedSingleState.interval
            : '1h';
        let currentExchange = typeof persistedSingleState.exchange === 'string' && persistedSingleState.exchange
            ? persistedSingleState.exchange
            : 'BINANCE'; // BINANCE, BINANCE-FUTURES, BYBIT, BYBIT-FUTURES
        let singleChartType = normalizeChartType(persistedSingleState.chartType);
        let singlePriceScaleMode = normalizePriceScaleMode(persistedSingleState.priceScaleMode);
        const LIMIT = 1000;

        // Initialize chart variables
        let chart;
        let currentSeries;
        let multiChartLayout = null;
        let currentLayoutMode = normalizeLayoutMode(persistedDemoState?.layoutMode);
        let currentMultiChartActiveIndex = Number.isInteger(persistedMultiState.activeIndex) ? persistedMultiState.activeIndex : 0;
        let multiChartMeta = Array.isArray(persistedMultiState.slots)
            ? persistedMultiState.slots.map((slot, index) => normalizeSlotState(slot, {
                symbol: index === 0 ? currentSymbol : index === 1 ? 'ETHUSDT' : index === 2 ? 'SOLUSDT' : 'BNBUSDT',
                interval: currentInterval,
                exchange: currentExchange,
            }))
            : [];
        let fullData = [];
        let replayActive = false;
        let replaySelecting = false;
        let replayIndex = -1;
        let replayTimer = null;
        let replayStopButton;
        let replayBackButton;
        let replayPlayButton;
        let replayForwardButton;
        let replaySelectButton;
        let replaySpeedSelect;
        let replaySlider;
        let replayStatus;
        let replayIntervalLabel;
        let replayPanel;
        let replayPickerLine;
        let replayToolbarButton = null;
        let replayToolbarObserver = null;
        let layoutToolbarButton = null;
        let layoutToolbarObserver = null;
        let layoutToolbarDismissBound = false;
        let settingsToolbarButton = null;
        let replayControlsInitialized = false;
        const multiChartSubscribedWidgets = new WeakSet();

        function getSingleChartStateSnapshot() {
            return {
                symbol: currentSymbol,
                interval: currentInterval,
                exchange: currentExchange,
                chartType: normalizeChartType(chart?.chartType || singleChartType),
                priceScaleMode: normalizePriceScaleMode(chart?.priceScaleMode || singlePriceScaleMode),
            };
        }

        function getMultiChartSlotsSnapshot() {
            if (multiChartLayout) {
                return multiChartLayout.charts.map((widget, index) => normalizeSlotState({
                    symbol: widget.symbol,
                    interval: widget.timeframe,
                    timeframe: widget.timeframe,
                    exchange: widget.model.exchange,
                    chartType: widget.chartType,
                    priceScaleMode: widget.priceScaleMode,
                }, {
                    symbol: index === 0 ? currentSymbol : 'BTCUSDT',
                    interval: currentInterval,
                    exchange: currentExchange,
                }));
            }

            if (multiChartMeta.length > 0) {
                return multiChartMeta.map((slot, index) => normalizeSlotState(slot, {
                    symbol: index === 0 ? currentSymbol : 'BTCUSDT',
                    interval: currentInterval,
                    exchange: currentExchange,
                }));
            }

            return [];
        }

        function saveDemoLayoutState() {
            try {
                const singleState = getSingleChartStateSnapshot();
                const multiSlots = getMultiChartSlotsSnapshot();

                singleChartType = singleState.chartType;
                singlePriceScaleMode = singleState.priceScaleMode;

                if (multiSlots.length > 0) {
                    multiChartMeta = multiSlots.map((slot) => ({ ...slot }));
                }

                localStorage.setItem(DEMO_LAYOUT_STORAGE_KEY, JSON.stringify({
                    layoutMode: currentLayoutMode,
                    single: singleState,
                    multi: {
                        activeIndex: currentMultiChartActiveIndex,
                        slots: multiSlots,
                    },
                }));
            } catch (error) {
                console.warn('Layout durumu kaydedilemedi:', error);
            }
        }
        
        // ========================================================================
        // Binance Data Fetcher
        // ========================================================================
        async function fetchBinanceData(symbol, interval, isFutures = false) {
            try {
                const MAX_PAGES = 2;
                let allData = [];
                let endTime = null;
                const baseUrl = isFutures 
                    ? 'https://fapi.binance.com/fapi/v1/klines'
                    : 'https://api.binance.com/api/v3/klines';

                console.log(`📊 Fetching ${symbol} from Binance ${isFutures ? 'Futures' : 'Spot'}...`);
                const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

                for (let i = 0; i < MAX_PAGES; i++) {
                    let url = `${baseUrl}?symbol=${symbol.toUpperCase()}&interval=${interval}&limit=1000`;
                    if (endTime) url += `&endTime=${endTime}`;

                    const response = await fetch(url);
                    if (!response.ok) break;
                    
                    const rawData = await response.json();
                    if (rawData.length === 0) break;

                    const pageData = rawData.map(d => ({
                        time: d[0],
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4]),
                        volume: parseFloat(d[5])
                    }));

                    allData = [...pageData, ...allData];
                    endTime = pageData[0].time - 1;
                    if (rawData.length < LIMIT) break;
                    if (i < MAX_PAGES - 1) await delay(300);
                }

                allData.sort((a, b) => a.time - b.time);
                return allData.filter((v, i, a) => i === 0 || v.time !== a[i-1].time);
            } catch (error) {
                console.error('❌ Error fetching Binance data:', error);
                return [];
            }
        }

        // ========================================================================
        // Bybit Data Fetcher
        // ========================================================================
        async function fetchBybitData(symbol, interval, isFutures = false) {
            try {
                // Convert interval to Bybit format
                const intervalMap = {
                    '1m': '1', '3m': '3', '5m': '5', '15m': '15', '30m': '30',
                    '1h': '60', '2h': '120', '4h': '240', '6h': '360', '12h': '720',
                    '1d': 'D', '1w': 'W', '1M': 'M'
                };
                const bybitInterval = intervalMap[interval] || '60';
                const category = isFutures ? 'linear' : 'spot';

                console.log(`📊 Fetching ${symbol} from Bybit ${isFutures ? 'Futures' : 'Spot'}...`);

                const url = `https://api.bybit.com/v5/market/kline?category=${category}&symbol=${symbol}&interval=${bybitInterval}&limit=200`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error(`Bybit API error: ${response.status}`);
                
                const data = await response.json();
                if (data.retCode !== 0 || !data.result?.list) {
                    throw new Error(`Bybit API error: ${data.retMsg}`);
                }

                // Bybit returns [startTime, open, high, low, close, volume, turnover]
                // Sorted newest first, we need oldest first
                return data.result.list.reverse().map(c => ({
                    time: parseInt(c[0]),
                    open: parseFloat(c[1]),
                    high: parseFloat(c[2]),
                    low: parseFloat(c[3]),
                    close: parseFloat(c[4]),
                    volume: parseFloat(c[5])
                }));
            } catch (error) {
                console.error('❌ Error fetching Bybit data:', error);
                return [];
            }
        }

        // ========================================================================
        // OKX Data Fetcher
        // ========================================================================
        async function fetchOkxData(symbol, interval, isFutures = false) {
            try {
                // Convert interval to OKX format
                const intervalMap = {
                    '1m': '1m', '3m': '3m', '5m': '5m', '15m': '15m', '30m': '30m',
                    '1h': '1H', '2h': '2H', '4h': '4H', '6h': '6H', '12h': '12H',
                    '1d': '1D', '1w': '1W', '1M': '1M'
                };
                const bar = intervalMap[interval] || '1H';
                
                // Symbol already comes in correct format from symbol search (BTC-USDT or BTC-USDT-SWAP)
                let instId = symbol;
                
                // Only add -SWAP suffix if futures and not already present
                if (isFutures && !instId.includes('-SWAP')) {
                    instId = instId + '-SWAP';
                }

                console.log(`📊 Fetching ${instId} from OKX ${isFutures ? 'Futures' : 'Spot'}...`);

                const url = `https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=300`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error(`OKX API error: ${response.status}`);
                
                const data = await response.json();
                if (data.code !== '0' || !data.data) {
                    throw new Error(`OKX API error: ${data.msg}`);
                }

                // OKX returns [ts, open, high, low, close, vol, ...]
                // Sorted newest first, we need oldest first
                return data.data.reverse().map(c => ({
                    time: parseInt(c[0]),
                    open: parseFloat(c[1]),
                    high: parseFloat(c[2]),
                    low: parseFloat(c[3]),
                    close: parseFloat(c[4]),
                    volume: parseFloat(c[5])
                }));
            } catch (error) {
                console.error('❌ Error fetching OKX data:', error);
                return [];
            }
        }

        // ========================================================================
        // Universal Data Fetcher
        // ========================================================================
        async function fetchData(symbol, interval, exchange) {
            switch(exchange) {
                case 'BINANCE':
                    return fetchBinanceData(symbol, interval, false);
                case 'BINANCE-FUTURES':
                    return fetchBinanceData(symbol, interval, true);
                case 'BYBIT':
                    return fetchBybitData(symbol, interval, false);
                case 'BYBIT-FUTURES':
                    return fetchBybitData(symbol, interval, true);
                case 'OKX':
                    return fetchOkxData(symbol, interval, false);
                case 'OKX-FUTURES':
                    return fetchOkxData(symbol, interval, true);
                default:
                    console.warn(`Unknown exchange: ${exchange}, falling back to Binance`);
                    return fetchBinanceData(symbol, interval, false);
            }
        }

        // ========================================================================
        // WebSocket for Real-time Updates
        // ========================================================================
        let currentWebSocket = null;

        function getPrimarySeries() {
            return chart?.model?.serieses?.[0] ?? null;
        }

        function getPrimarySeriesForWidget(widget) {
            return widget?.model?.serieses?.[0] ?? null;
        }

        function closeRealtimeFeed() {
            if (!currentWebSocket) return;
            currentWebSocket.close();
            currentWebSocket = null;
        }

        function clearReplayTimer() {
            if (replayTimer !== null) {
                clearInterval(replayTimer);
                replayTimer = null;
            }
        }

        function getPaneCanvas() {
            return chart?._paneWidget?.canvas ?? null;
        }

        function setReplayPickerVisible(visible) {
            if (!replayPickerLine) return;
            replayPickerLine.style.display = visible ? 'block' : 'none';
        }

        function setReplaySelectionMode(active) {
            if (active && replayActive) {
                clearReplayTimer();
                replayActive = false;
                renderChartData(fullData);
            }
            replaySelecting = active;
            if (!active) {
                setReplayPickerVisible(false);
            } else {
                updateReplayStatusText('Bir bar sec');
            }
            updateReplayControls();
        }

        function updateReplayStatusText(text) {
            if (replayStatus) {
                replayStatus.textContent = text;
            }
        }

        function formatReplayTime(timestamp) {
            try {
                return new Date(timestamp).toLocaleString('tr-TR', {
                    day: '2-digit',
                    month: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (error) {
                return String(timestamp);
            }
        }

        function updateReplayControls() {
            if (!replayStatus) return;

            const hasData = fullData.length > 0;
            const replayEnabled = replayActive && hasData;
            const showPanel = replayEnabled || replaySelecting;

            if (replayPanel) {
                replayPanel.classList.toggle('hidden', !showPanel);
            }

            replayStopButton.disabled = !replayActive && !replaySelecting;
            replayBackButton.disabled = !replayEnabled || replayIndex <= 0;
            replayPlayButton.disabled = !replayEnabled;
            replayForwardButton.disabled = !replayEnabled || replayIndex >= fullData.length - 1;
            replaySpeedSelect.disabled = !replayEnabled;
            replaySlider.disabled = !replayEnabled;
            replaySelectButton.disabled = !hasData;
            replaySlider.max = String(Math.max(0, fullData.length - 1));
            replaySlider.value = String(Math.max(0, replayEnabled ? replayIndex : fullData.length - 1));
            replaySelectButton.classList.toggle('active', replaySelecting);
            replayPlayButton.innerHTML = replayTimer === null
                ? `<svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="m7 5 8 5-8 5z"/></svg>`
                : `<svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M6 5h3v10H6zm5 0h3v10h-3z"/></svg>`;
            replayStopButton.title = replaySelecting ? 'Secimi iptal et' : 'Replay bitir';
            replayIntervalLabel.textContent = String(currentInterval).toUpperCase();

            if (replayToolbarButton) {
                replayToolbarButton.style.background = replayActive || replaySelecting ? 'rgba(41, 98, 255, 0.18)' : 'transparent';
                replayToolbarButton.style.color = replayActive || replaySelecting ? '#2962ff' : '#787b86';
            }

            if (!hasData) {
                updateReplayStatusText('Veri yok');
                return;
            }

            if (replaySelecting) {
                updateReplayStatusText('Bir bar sec');
                return;
            }

            if (!replayActive) {
                updateReplayStatusText('Canli');
                return;
            }

            const currentBar = fullData[Math.max(0, replayIndex)];
            updateReplayStatusText(`Replay ${replayIndex + 1}/${fullData.length} • ${formatReplayTime(currentBar.time)}`);
        }

        function renderChartData(data) {
            const series = getPrimarySeries();
            if (!series) return;
            chart.setData(series, data);
            chart.timeScale().scrollToPosition(0, false);
            chart.model.fullUpdate();
        }

        function mergeCandleIntoFullData(candle) {
            if (fullData.length === 0) {
                fullData = [{ ...candle }];
                return;
            }

            const lastCandle = fullData[fullData.length - 1];
            if (lastCandle.time === candle.time) {
                lastCandle.high = Math.max(lastCandle.high, candle.high);
                lastCandle.low = Math.min(lastCandle.low, candle.low);
                lastCandle.close = candle.close;
                lastCandle.volume = candle.volume;
                return;
            }

            if (candle.time > lastCandle.time) {
                fullData.push({ ...candle });
            }
        }

        function renderReplaySlice() {
            if (!replayActive || fullData.length === 0) return;
            const clampedIndex = Math.max(0, Math.min(fullData.length - 1, replayIndex));
            replayIndex = clampedIndex;
            renderChartData(fullData.slice(0, replayIndex + 1));
            updateReplayControls();
        }

        function stepReplay(delta) {
            if (!replayActive || fullData.length === 0) return;
            replayIndex = Math.max(0, Math.min(fullData.length - 1, replayIndex + delta));
            renderReplaySlice();

            if (replayIndex >= fullData.length - 1) {
                clearReplayTimer();
                updateReplayControls();
            }
        }

        function startReplayTimer() {
            if (!replayActive || replayTimer !== null) return;
            const speed = Number(replaySpeedSelect.value || 700);
            replayTimer = setInterval(() => {
                if (replayIndex >= fullData.length - 1) {
                    clearReplayTimer();
                    updateReplayControls();
                    return;
                }
                stepReplay(1);
            }, speed);
            updateReplayControls();
        }

        function enterReplayMode(startIndex) {
            if (fullData.length === 0 || replayActive) return;
            closeRealtimeFeed();
            clearReplayTimer();
            replayActive = true;
            replaySelecting = false;
            setReplayPickerVisible(false);
            replayIndex = Math.max(0, Math.min(fullData.length - 1, startIndex));
            renderReplaySlice();
        }

        async function exitReplayMode() {
            if (!replayActive && !replaySelecting) return;
            const wasReplayActive = replayActive;
            clearReplayTimer();
            replayActive = false;
            replaySelecting = false;
            setReplayPickerVisible(false);
            replayIndex = fullData.length - 1;
            updateReplayControls();
            if (wasReplayActive) {
                await updateChartData(currentSymbol, currentInterval, currentExchange, true);
            }
        }

        function updateReplayPickerFromClientX(clientX) {
            if (!replaySelecting || fullData.length === 0) return;
            const paneCanvas = getPaneCanvas();
            if (!paneCanvas) return;
            const rect = paneCanvas.getBoundingClientRect();
            const chartRect = document.getElementById('chart').getBoundingClientRect();
            const localX = clientX - rect.left;
            const index = Math.max(0, Math.min(fullData.length - 1, Math.round(chart.timeScale().coordinateToIndex(localX))));
            const snappedX = chart.timeScale().indexToCoordinate(index);
            replayPickerLine.style.left = `${rect.left - chartRect.left + snappedX}px`;
            replayPickerLine.dataset.index = String(index);
            setReplayPickerVisible(true);
        }

        function attachReplaySelectionEvents() {
            const paneCanvas = getPaneCanvas();
            if (!paneCanvas) return;

            paneCanvas.addEventListener('mousemove', (event) => {
                updateReplayPickerFromClientX(event.clientX);
            });

            paneCanvas.addEventListener('mouseleave', () => {
                if (replaySelecting) {
                    setReplayPickerVisible(false);
                }
            });

            paneCanvas.addEventListener('click', (event) => {
                if (!replaySelecting) return;
                event.preventDefault();
                event.stopPropagation();
                updateReplayPickerFromClientX(event.clientX);
                const index = Number(replayPickerLine.dataset.index || '-1');
                if (Number.isFinite(index) && index >= 0) {
                    enterReplayMode(index);
                }
            }, true);
        }

            replayPanel = document.getElementById('replay-panel');
            replayStopButton = document.getElementById('replay-stop');
            replayBackButton = document.getElementById('replay-step-back');
            replayPlayButton = document.getElementById('replay-play');
            replayForwardButton = document.getElementById('replay-step-forward');
            replaySelectButton = document.getElementById('replay-select');
            replaySpeedSelect = document.getElementById('replay-speed');

            replayStatus = document.getElementById('replay-status');

            if (replayControlsInitialized) {

            replayControlsInitialized = true;

            replayStopButton.addEventListener('click', () => {
                void exitReplayMode();
            });
            replaySelectButton.addEventListener('click', () => {
                if (!fullData.length) return;
                setReplaySelectionMode(!replaySelecting);
            });
            replayBackButton.addEventListener('click', () => stepReplay(-1));
            replayForwardButton.addEventListener('click', () => stepReplay(1));
            replayPlayButton.addEventListener('click', () => {
                if (!replayActive) return;
                if (replayTimer === null) {
                    startReplayTimer();
                } else {
                    clearReplayTimer();
                    updateReplayControls();
                }
            });
            replaySpeedSelect.addEventListener('change', () => {
                if (replayTimer !== null) {
                    clearReplayTimer();
                    startReplayTimer();
                } else {
                    updateReplayControls();
                }
            });
            replaySlider.addEventListener('input', (event) => {
                if (!replayActive) return;
                replayIndex = Number(event.target.value);
                renderReplaySlice();
            });

            updateReplayControls();
        }

        async function loadChartWidgetData(widget, symbol, interval, exchange, slotIndex = 0) {
            if (!widget) return;

            widget.setLoading(true, `Loading ${symbol} from ${exchange}...`);
            try {
                const data = await fetchData(symbol, interval, exchange);
                if (!data.length) return;

                const series = getPrimarySeriesForWidget(widget);
                if (!series) return;

                widget.setData(series, data);
                const currentSlot = multiChartMeta[slotIndex] || {};
                multiChartMeta[slotIndex] = normalizeSlotState({
                    ...currentSlot,
                    symbol,
                    interval,
                    timeframe: interval,
                    exchange,
                    chartType: widget.chartType,
                    priceScaleMode: widget.priceScaleMode,
                }, currentSlot);
                saveDemoLayoutState();
            } finally {
                widget.setLoading(false);
            }
        }

        function attachMultiChartSubscriptions(widget, slotIndex) {
            if (!widget || multiChartSubscribedWidgets.has(widget)) {
                return;
            }
            multiChartSubscribedWidgets.add(widget);

            widget.symbolChanged.subscribe(async (symbolInfo) => {
                const symbol = typeof symbolInfo === 'object' ? symbolInfo.symbol : symbolInfo;
                const exchange = typeof symbolInfo === 'object' && symbolInfo.exchange
                    ? symbolInfo.exchange
                    : (multiChartMeta[slotIndex]?.exchange || currentExchange);
                const interval = multiChartMeta[slotIndex]?.interval || currentInterval;

                await loadChartWidgetData(widget, symbol, interval, exchange, slotIndex);
            });

            widget.timeframeChanged.subscribe(async (newInterval) => {
                let interval = String(newInterval).toLowerCase();
                if (interval === 'd') interval = '1d';
                if (interval === 'w') interval = '1w';

                const meta = multiChartMeta[slotIndex] || {
                    symbol: currentSymbol,
                    interval: currentInterval,
                    exchange: currentExchange,
                };

                await loadChartWidgetData(widget, meta.symbol, interval, meta.exchange, slotIndex);
            });
        }

        function getLayoutSlots(mode) {
            const defaults = [
                { symbol: currentSymbol, interval: currentInterval, exchange: currentExchange, chartType: singleChartType, priceScaleMode: singlePriceScaleMode },
                { symbol: currentSymbol, interval: currentInterval, exchange: currentExchange, chartType: singleChartType, priceScaleMode: singlePriceScaleMode },
                { symbol: currentSymbol, interval: currentInterval, exchange: currentExchange, chartType: singleChartType, priceScaleMode: singlePriceScaleMode },
                { symbol: currentSymbol, interval: currentInterval, exchange: currentExchange, chartType: singleChartType, priceScaleMode: singlePriceScaleMode },
            ];
            const slots = defaults.map((fallback, index) => normalizeSlotState(multiChartMeta[index], fallback));

            switch (mode) {
                case '2x1':
                case '1x2':
                    return slots.slice(0, 2).map((slot) => ({
                        ...slot,
                        timeframe: slot.interval,
                    }));
                case '1x3':
                    return slots.slice(0, 3).map((slot) => ({
                        ...slot,
                        timeframe: slot.interval,
                    }));
                case '2x2':
                    return slots.slice(0, 4).map((slot) => ({
                        ...slot,
                        timeframe: slot.interval,
                    }));
                default:
                    return [{
                        ...slots[0],
                        timeframe: slots[0].interval,
                    }];
            }
        }

        async function destroyCurrentView() {
            saveDemoLayoutState();
            clearReplayTimer();
            replayActive = false;
            replaySelecting = false;
            replayIndex = -1;
            setReplayPickerVisible(false);
            closeRealtimeFeed();

            if (replayToolbarObserver) {
                replayToolbarObserver.disconnect();
                replayToolbarObserver = null;
            }
            if (layoutToolbarObserver) {
                layoutToolbarObserver.disconnect();
                layoutToolbarObserver = null;
            }

            layoutToolbarButton = null;
            settingsToolbarButton = null;

            if (multiChartLayout) {
                multiChartLayout.destroy();
                multiChartLayout = null;
            }

            if (chart) {
                chart.dispose();
                chart = null;
                currentSeries = null;
            }

            const chartContainer = document.getElementById('chart');
            if (chartContainer) {
                chartContainer.innerHTML = '';
            }
        }

        async function initMultiChart(mode) {
            await destroyCurrentView();
            currentLayoutMode = mode;

            replayPanel.classList.add('hidden');

            const slots = getLayoutSlots(mode);
            multiChartMeta = slots.map((slot) => ({ ...slot, interval: slot.timeframe }));
            multiChartLayout = LightweightCharts.createMultiChartLayout('#chart', {
                layout: mode,
                syncSymbol: false,
                syncTimeframe: false,
                activeIndex: Math.min(currentMultiChartActiveIndex, Math.max(0, slots.length - 1)),
                charts: slots.map((slot) => ({
                    locale: 'tr',
                    symbol: slot.symbol,
                    timeframe: slot.timeframe,
                    exchange: slot.exchange,
                    layout: {
                        backgroundColor: '#1a1a2e',
                        textColor: '#d1d4dc',
                    },
                    grid: {
                        vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                        horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
                    }
                })),
            });

            for (let i = 0; i < slots.length; i++) {
                const widget = multiChartLayout.getChart(i);
                if (!widget) continue;
                widget.setChartType(normalizeChartType(slots[i].chartType));
                widget.setPriceScaleMode(normalizePriceScaleMode(slots[i].priceScaleMode));
                attachMultiChartSubscriptions(widget, i);
                await loadChartWidgetData(widget, slots[i].symbol, slots[i].timeframe, slots[i].exchange, i);
            }

            multiChartLayout.activeChartChanged.subscribe((index) => {
                currentMultiChartActiveIndex = index;
                saveDemoLayoutState();
            });

            currentMultiChartActiveIndex = Math.min(currentMultiChartActiveIndex, Math.max(0, slots.length - 1));

            observeToolbarForLayoutSelector();
            saveDemoLayoutState();
        }

        async function initSingleChart() {
            await destroyCurrentView();
            currentLayoutMode = 'single';

            // Create full screen chart
            chart = LightweightCharts.createChart('#chart', {
                 locale: 'tr', // 'en' or 'tr'
                 symbol: currentSymbol,
                 timeframe: currentInterval,
                 exchange: currentExchange,
                 layout: {
                     backgroundColor: '#1a1a2e',
                     textColor: '#d1d4dc',
                 },
                 grid: {
                     vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                     horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
                 }
            });

            // Add candlestick series
            currentSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickVisible: true
            });

            chart.setChartType(singleChartType);
            chart.setPriceScaleMode(singlePriceScaleMode);

            observeToolbarForReplayButton();
            observeToolbarForLayoutSelector();
            attachReplaySelectionEvents();
            updateReplayControls();

            chart.symbolChanged.subscribe(async (symbolInfo) => {
                if (typeof symbolInfo === 'object' && symbolInfo.exchange) {
                    currentSymbol = symbolInfo.symbol;
                    currentExchange = symbolInfo.exchange;
                    console.log(`🔄 Symbol changed to: ${currentSymbol} @ ${currentExchange}`);
                } else {
                    currentSymbol = symbolInfo;
                }
                await updateChartData(currentSymbol, currentInterval, currentExchange);
                saveDemoLayoutState();
            });

            chart.timeframeChanged.subscribe(async (newInterval) => {
                let interval = newInterval.toLowerCase();
                if (interval === 'd') interval = '1d';
                if (interval === 'w') interval = '1w';

                currentInterval = interval;
                await updateChartData(currentSymbol, currentInterval, currentExchange);
                saveDemoLayoutState();
            });

            await updateChartData(currentSymbol, currentInterval, currentExchange);
            saveDemoLayoutState();
        }

        async function switchLayoutMode(mode) {
            closeLayoutToolbarMenu();

            if (mode === currentLayoutMode) {
                updateLayoutToolbarButton();
                return;
            }

            if (mode === 'single') {
                await initSingleChart();
                updateLayoutToolbarButton();
                return;
            }

            if (currentLayoutMode === 'single') {
                const baseState = normalizeSlotState({
                    symbol: currentSymbol,
                    interval: currentInterval,
                    timeframe: currentInterval,
                    exchange: currentExchange,
                    chartType: chart?.chartType || singleChartType,
                    priceScaleMode: chart?.priceScaleMode || singlePriceScaleMode,
                }, {
                    symbol: currentSymbol,
                    interval: currentInterval,
                    exchange: currentExchange,
                    chartType: singleChartType,
                    priceScaleMode: singlePriceScaleMode,
                });

                multiChartMeta = Array.from({ length: 4 }, () => ({ ...baseState }));
                currentMultiChartActiveIndex = 0;
            }

            await initMultiChart(mode);
            updateLayoutToolbarButton();
        }

        function subscribeToWebSocket(symbol, interval, exchange) {
            // Close existing WebSocket
            closeRealtimeFeed();

            // Route to appropriate WebSocket based on exchange
            if (exchange.startsWith('BINANCE')) {
                subscribeToBinanceWS(symbol, interval, exchange === 'BINANCE-FUTURES');
            } else if (exchange.startsWith('BYBIT')) {
                subscribeToBybitWS(symbol, interval, exchange === 'BYBIT-FUTURES');
            } else if (exchange.startsWith('OKX')) {
                subscribeToOkxWS(symbol, interval, exchange === 'OKX-FUTURES');
            } else {
                console.log('⏸️ WebSocket not available for:', exchange);
            }
        }

        // ========================================================================
        // Binance WebSocket
        // ========================================================================
        function subscribeToBinanceWS(symbol, interval, isFutures) {
            const wsUrl = isFutures 
                ? 'wss://fstream.binance.com/ws'
                : 'wss://stream.binance.com:9443/ws';
            
            const streamName = `${symbol.toLowerCase()}@kline_${interval}`;
            
            currentWebSocket = new WebSocket(`${wsUrl}/${streamName}`);
            
            currentWebSocket.onopen = () => {
                console.log(`🟡 Binance WebSocket connected: ${streamName}`);
            };
            
            currentWebSocket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.e === 'kline') {
                        const k = data.k;
                        const candle = {
                            time: k.t,
                            open: parseFloat(k.o),
                            high: parseFloat(k.h),
                            low: parseFloat(k.l),
                            close: parseFloat(k.c),
                            volume: parseFloat(k.v)
                        };
                        updateChartWithCandle(candle, k.x);
                    }
                } catch (e) {
                    console.error('Binance WebSocket parse error:', e);
                }
            };
            
            currentWebSocket.onerror = (error) => console.error('❌ Binance WebSocket error:', error);
            currentWebSocket.onclose = () => console.log('🟡 Binance WebSocket disconnected');
        }

        // ========================================================================
        // Bybit WebSocket
        // ========================================================================
        function subscribeToBybitWS(symbol, interval, isFutures) {
            const wsUrl = isFutures 
                ? 'wss://stream.bybit.com/v5/public/linear'
                : 'wss://stream.bybit.com/v5/public/spot';
            
            // Convert interval to Bybit format
            const intervalMap = {
                '1m': '1', '3m': '3', '5m': '5', '15m': '15', '30m': '30',
                '1h': '60', '2h': '120', '4h': '240', '6h': '360', '12h': '720',
                '1d': 'D', '1w': 'W'
            };
            const bybitInterval = intervalMap[interval] || '60';
            
            currentWebSocket = new WebSocket(wsUrl);
            
            currentWebSocket.onopen = () => {
                console.log(`🟣 Bybit WebSocket connected`);
                // Subscribe to kline
                const subscribeMsg = {
                    op: 'subscribe',
                    args: [`kline.${bybitInterval}.${symbol}`]
                };
                currentWebSocket.send(JSON.stringify(subscribeMsg));
            };
            
            currentWebSocket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Bybit kline format: { topic: "kline.1.BTCUSDT", data: [...] }
                    if (data.topic && data.topic.startsWith('kline.') && data.data) {
                        for (const k of data.data) {
                            const candle = {
                                time: parseInt(k.start),
                                open: parseFloat(k.open),
                                high: parseFloat(k.high),
                                low: parseFloat(k.low),
                                close: parseFloat(k.close),
                                volume: parseFloat(k.volume)
                            };
                            updateChartWithCandle(candle, k.confirm);
                        }
                    }
                } catch (e) {
                    console.error('Bybit WebSocket parse error:', e);
                }
            };
            
            currentWebSocket.onerror = (error) => console.error('❌ Bybit WebSocket error:', error);
            currentWebSocket.onclose = () => console.log('🟣 Bybit WebSocket disconnected');
        }

        // ========================================================================
        // OKX WebSocket
        // ========================================================================
        function subscribeToOkxWS(symbol, interval, isFutures) {
            // OKX Candlesticks require the /business endpoint, NOT /public
            const wsUrl = 'wss://ws.okx.com:8443/ws/v5/business';
            
            // Convert interval to OKX format
            const intervalMap = {
                '1m': '1m', '3m': '3m', '5m': '5m', '15m': '15m', '30m': '30m',
                '1h': '1H', '2h': '2H', '4h': '4H', '6h': '6H', '12h': '12H',
                '1d': '1D', '1w': '1W'
            };
            const okxInterval = intervalMap[interval] || '1H';
            
            // Symbol already in OKX format (BTC-USDT or BTC-USDT-SWAP)
            const instId = symbol;
            
            currentWebSocket = new WebSocket(wsUrl);
            
            currentWebSocket.onopen = () => {
                console.log(`⚫ OKX WebSocket connected`);
                // Subscribe to candle
                const subscribeMsg = {
                    op: 'subscribe',
                    args: [{ channel: `candle${okxInterval}`, instId: instId }]
                };
                console.log('⚫ OKX Subscribing:', JSON.stringify(subscribeMsg));
                currentWebSocket.send(JSON.stringify(subscribeMsg));
            };
            
            currentWebSocket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Log subscription response
                    if (data.event) {
                        console.log('⚫ OKX Event:', data.event, data.code, data.msg);
                        return;
                    }
                    
                    // OKX candle format: { arg: { channel, instId }, data: [[ts, o, h, l, c, vol, ...]] }
                    if (data.data && data.arg?.channel?.startsWith('candle')) {
                        for (const k of data.data) {
                            const candle = {
                                time: parseInt(k[0]),
                                open: parseFloat(k[1]),
                                high: parseFloat(k[2]),
                                low: parseFloat(k[3]),
                                close: parseFloat(k[4]),
                                volume: parseFloat(k[5])
                            };
                            updateChartWithCandle(candle, false);
                        }
                    }
                } catch (e) {
                    console.error('OKX WebSocket parse error:', e);
                }
            };
            
            currentWebSocket.onerror = (error) => console.error('❌ OKX WebSocket error:', error);
            currentWebSocket.onclose = (event) => console.log('⚫ OKX WebSocket disconnected, code:', event.code, event.reason);
        }

        function updateChartWithCandle(candle, isClosed) {
            mergeCandleIntoFullData(candle);
            updateReplayControls();

            if (replayActive) {
                return;
            }

            const series = getPrimarySeries();
            if (!series || !series.data || series.data.length === 0) return;

            const lastCandle = series.data[series.data.length - 1];
            
            // If same timestamp, update existing candle
            if (lastCandle.time === candle.time) {
                lastCandle.high = Math.max(lastCandle.high, candle.high);
                lastCandle.low = Math.min(lastCandle.low, candle.low);
                lastCandle.close = candle.close;
                lastCandle.volume = candle.volume;
            } else if (candle.time > lastCandle.time) {
                // New candle, add to series
                series.data.push(candle);
                chart.model.timeScale.setPointsCount(series.data.length);
            }
            
            // Trigger update
            chart.model.fullUpdate();
        }

        async function updateChartData(symbol, interval, exchange, skipReplayReset = false) {
            // Show loading indicator
            chart.setLoading(true, `Loading ${symbol} from ${exchange}...`);
            
            try {
                if (!skipReplayReset) {
                    clearReplayTimer();
                    replayActive = false;
                    replaySelecting = false;
                    setReplayPickerVisible(false);
                    replayIndex = -1;
                }

                const data = await fetchData(symbol, interval, exchange);
                if (data.length > 0) {
                    fullData = data.map(bar => ({ ...bar }));
                    updateReplayControls();

                    const series = getPrimarySeries();
                    if (series) {
                        renderChartData(fullData);
                        console.log(`✅ Loaded ${data.length} candles for ${symbol} from ${exchange}`);
                        
                        // Subscribe to WebSocket for real-time updates
                        subscribeToWebSocket(symbol, interval, exchange);
                        saveDemoLayoutState();
                    }
                } else {
                    alert(`${symbol} verisi ${exchange}'dan çekilemedi.`);
                }
            } finally {
                chart.setLoading(false);
            }
        }

        async function initChart() {
            initReplayControls();
            if (currentLayoutMode === 'single') {
                await initSingleChart();
                return;
            }

            await initMultiChart(currentLayoutMode);
        }

        window.addEventListener('beforeunload', () => {
            saveDemoLayoutState();
        });
        document.addEventListener('DOMContentLoaded', initChart);
    </script>
